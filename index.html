<!DOCTYPE html>
<html lang="en-IN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#12356b"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-title" content="Karwa Warehouse & MFG Attendance">
<title>Karwa Warehouse & MFG Attendance</title>
<style>
:root{--brand:#12356b;--acc:#e8821a;--ink:#1b1f2a;--muted:#667085;--line:#e5e8ee;--bg:#f4f6fa;--card:#fff;--good:#1f8a5b;--mid:#c98a12;--low:#c4384b;--r:14px}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans",sans-serif;color:var(--ink);background:var(--bg);font-size:15px;line-height:1.45;overscroll-behavior-y:none}
h2{font-size:1.25rem;margin:.2rem 0 .6rem}h3{font-size:1rem;margin:0 0 .5rem}
.wrap{max-width:1100px;margin:0 auto;padding:12px 12px 92px}.role-admin .wrap{padding-bottom:30px;max-width:1300px}
.top{position:sticky;top:0;z-index:20;display:flex;align-items:center;gap:10px;padding:9px 12px;background:var(--brand);color:#fff}
.top b{font-size:1.02rem}.top small{opacity:.8;display:block;font-size:.72rem;line-height:1}
.logo{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;background:#fff;color:var(--brand);font-weight:800;font-size:.8rem}
.anav{display:flex;gap:3px;flex:1;overflow-x:auto}.anav a{color:#fff;text-decoration:none;padding:7px 10px;border-radius:9px;opacity:.85;white-space:nowrap;font-size:.9rem}.anav a.on{background:rgba(255,255,255,.2);opacity:1}
.who{margin-left:auto;font-size:.82rem;display:flex;gap:6px;align-items:center;white-space:nowrap}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:13px;margin-bottom:11px}
.muted{color:var(--muted)}.small{font-size:.82rem}.center{text-align:center}.hidden{display:none!important}.mt{margin-top:10px}.right{text-align:right}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.between{justify-content:space-between}
button,.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;font:inherit;font-weight:600;border-radius:11px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:10px 14px;cursor:pointer}
button:disabled{opacity:.5}.primary{background:var(--brand);border-color:var(--brand);color:#fff}.accent{background:var(--acc);border-color:var(--acc);color:#fff}
.danger{color:var(--low);border-color:#f0c2c9}.good{color:var(--good);border-color:#b9e2cd}.sm{padding:5px 9px;font-size:.82rem;border-radius:8px}.block{width:100%}.big{padding:18px;font-size:1.15rem}
input,select,textarea{width:100%;font:inherit;font-size:16px;padding:10px 11px;border:1px solid #d5dae3;border-radius:10px;background:#fff;color:var(--ink)}
input[type=checkbox],input[type=radio]{width:auto}label{display:block;font-size:.84rem;color:var(--muted);font-weight:500}label>input,label>select,label>textarea{margin-top:4px;color:var(--ink)}
.stack>*+*{margin-top:11px}.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.g4{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media(max-width:560px){.g3,.g4{grid-template-columns:1fr 1fr}.anav{display:none}.top .who span.nm{display:none}}
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;background:#fff;border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.tabs a{flex:1;text-align:center;padding:8px 2px 7px;font-size:.72rem;color:var(--muted);text-decoration:none}.tabs a b{display:block;font-size:1.25rem;line-height:1.2}.tabs a.on{color:var(--brand);font-weight:700}
.chip{display:inline-block;min-width:34px;text-align:center;padding:2px 8px;border-radius:999px;font-weight:700;font-size:.8rem;border:1px solid var(--line);background:#f1f3f7;color:#475467}
.chip.P{background:#e3f5ec;color:var(--good);border-color:#b9e2cd}.chip.WO{background:#e4eefc;color:#2b5fb4;border-color:#bcd2f3}.chip.HD{background:#fdf1d9;color:#9a6a06;border-color:#f1d9a0}.chip.CO{background:#efe7fb;color:#6a3fb0;border-color:#d6c6f1}.chip.A{background:#fde6e9;color:var(--low);border-color:#f3bfc6}
.chip.pending{background:#f1f3f7;color:#667085;border-style:dashed}.chip.rejected{background:#fff;color:var(--low);border-color:var(--low)}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:5px}.cal .h{text-align:center;font-size:.72rem;color:var(--muted)}
.cal .d{min-height:58px;border:1px solid var(--line);border-radius:10px;padding:4px 3px;text-align:center;background:#fff;cursor:pointer;font-size:.8rem}.cal .d.today{border-color:var(--brand);box-shadow:0 0 0 1px var(--brand)}.cal .d.e{border:0;background:none;cursor:default}.cal .d .chip{margin-top:3px;font-size:.66rem;padding:1px 4px;min-width:0}
.big-btn{display:block;width:100%;padding:26px 10px;font-size:1.5rem;border-radius:18px}
table{border-collapse:collapse;width:100%}th,td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:left;font-size:.88rem;vertical-align:middle}th{font-size:.74rem;text-transform:uppercase;color:var(--muted);letter-spacing:.03em;background:#fafbfd;position:sticky;top:0}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}.scroll{overflow-x:auto}
.kpi{display:block;text-decoration:none;color:inherit}.kpi b{display:block;font-size:1.6rem}.kpi span{font-size:.8rem;color:var(--muted)}
.msg{padding:10px 12px;border-radius:10px;margin-bottom:10px;font-size:.92rem}.msg.ok{background:#e3f5ec;color:#14634a}.msg.err{background:#fde6e9;color:#8c2433}.msg.info{background:#e8eefb;color:#1d3f87}
.modal{position:fixed;inset:0;z-index:50;background:rgba(15,20,35,.55);display:flex;align-items:flex-end;justify-content:center}.modal>.box{background:#fff;width:100%;max-width:520px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px}
@media(min-width:700px){.modal{align-items:center}.modal>.box{border-radius:18px}}
.thumb{width:54px;height:54px;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;background:#eef}
video.live{width:100%;border-radius:12px;background:#000;transform:scaleX(-1);max-height:60vh}
.spin{display:inline-block;width:14px;height:14px;border:2px solid #ccd;border-top-color:var(--brand);border-radius:50%;animation:sp .8s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.pw{position:relative}.pw button{position:absolute;right:4px;top:22px;padding:4px 8px;font-size:.8rem}
.print-only{display:none}
@media print{.top,.tabs,.noprint,button{display:none!important}.print-only{display:block}.wrap{padding:0;max-width:none}body{background:#fff}.card{border:0;padding:0}th{position:static}}
</style>
</head>
<body>
<div id="app"></div>
<div id="modal"></div>
<script src="config.js"></script>
<script>
'use strict';
// =====================================================================================================
// Karwa Warehouse & MFG Attendance (frontend). Draws only what the server sends. Staff / managers never receive times, hours, selfies or GPS.
// =====================================================================================================
var API = (window.WHM_API_URL || '').trim();
var S = { token: localStorage.getItem('whm_tok') || '', user: null, boot: null, stores: [], busy: 0 };
try { S.user = JSON.parse(localStorage.getItem('whm_user') || 'null'); } catch (e) { S.user = null; }
var $ = function (id) { return document.getElementById(id); };
function h(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function dmy(s) { if (!s) return ''; var a = String(s).slice(0, 10).split('-'); return a[2] + '-' + a[1] + '-' + a[0]; }
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'], DOW = ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat', 'Sun'];
function pad(n) { return (n < 10 ? '0' : '') + n; }
function addDays(d, n) { var a = d.split('-').map(Number), t = new Date(Date.UTC(a[0], a[1] - 1, a[2] + n)); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1) + '-' + pad(t.getUTCDate()); }
function monthLabel(m) { var a = m.split('-'); return MON[Number(a[1]) - 1] + ' ' + a[0]; }
function addMonth(m, n) { var a = m.split('-').map(Number), t = new Date(Date.UTC(a[0], a[1] - 1 + n, 1)); return t.getUTCFullYear() + '-' + pad(t.getUTCMonth() + 1); }
function today() { return (S.boot && S.boot.today) || new Date().toISOString().slice(0, 10); }
var LABEL = { P: 'Present', WO: 'Week Off', HD: 'Half Day', CO: 'Comp Off', A: 'Absent', pending: 'Pending', rejected: 'Rejected' };
function chip(s) { if (!s) return ''; return '<span class="chip ' + h(s) + '">' + h(s === 'pending' ? 'Pending' : s === 'rejected' ? 'Rejected' : s) + '</span>'; }
function msg(kind, text) { return '<div class="msg ' + kind + '">' + h(text) + '</div>'; }
function toast(text, kind) { var el = document.createElement('div'); el.className = 'msg ' + (kind || 'ok'); el.style.cssText = 'position:fixed;left:12px;right:12px;top:60px;z-index:80;box-shadow:0 4px 18px rgba(0,0,0,.2)'; el.textContent = text; document.body.appendChild(el); setTimeout(function () { el.remove(); }, kind === 'err' ? 5200 : 2600); }
function fail(e) { toast(String((e && e.message) || e), 'err'); }

// ---- API
function call(action, data) {
  if (!API || /PASTE_YOUR/.test(API)) return Promise.reject(new Error('API URL set nahi hai. config.js mein Web app URL daalein.'));
  S.busy++;
  return fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify({ action: action, token: S.token, data: data || {} }) })
    .then(function (r) { return r.json(); }).then(function (j) {
      S.busy--;
      if (j && j.auth === false) { logout(true); throw new Error(j.error); }
      if (j && j.mustChange) { go('#/pw'); throw new Error(j.error); }
      if (!j || !j.ok) throw new Error((j && j.error) || 'Kuch gadbad hui');
      return j.data;
    }).catch(function (e) { S.busy = Math.max(0, S.busy - 1); if (/Failed to fetch|NetworkError|Load failed/i.test(String(e.message))) throw new Error('Internet nahi chal raha. Dobara try karein.'); throw e; });
}
function saveSession(token, user) { S.token = token; S.user = user; localStorage.setItem('whm_tok', token); localStorage.setItem('whm_user', JSON.stringify(user)); }
function logout(silent) { if (!silent && S.token) call('logout').catch(function () {}); S.token = ''; S.user = null; S.boot = null; localStorage.removeItem('whm_tok'); localStorage.removeItem('whm_user'); go('#/login'); }

// ---- modal + camera
function modal(html, onclose) { var m = $('modal'); m.innerHTML = '<div class="modal" data-act="mclose"><div class="box" data-stop="1">' + html + '</div></div>'; m._close = onclose; }
function closeModal() { var m = $('modal'); if (m._close) { try { m._close(); } catch (e) {} } m._close = null; m.innerHTML = ''; }
function stopStream(s) { if (s) s.getTracks().forEach(function (t) { t.stop(); }); }
function geo() { return new Promise(function (res) { if (!navigator.geolocation) return res({}); var done = false, to = setTimeout(function () { if (!done) { done = true; res({}); } }, 6000); navigator.geolocation.getCurrentPosition(function (p) { if (done) return; done = true; clearTimeout(to); res({ lat: p.coords.latitude, lng: p.coords.longitude, acc: p.coords.accuracy }); }, function () { if (!done) { done = true; clearTimeout(to); res({}); } }, { enableHighAccuracy: true, timeout: 5500, maximumAge: 20000 }); }); }
/** Live camera only (getUserMedia). No file picker, so a gallery photo cannot be chosen. Resolves with a compressed JPEG data URL. */
function takeSelfie(title) {
  return new Promise(function (resolve, reject) {
    var stream = null, done = false;
    function finish(v, err) { if (done) return; done = true; stopStream(stream); $('modal')._close = null; $('modal').innerHTML = ''; if (err) reject(err); else resolve(v); }
    modal('<h3>' + h(title) + '</h3><div id="camBody" class="stack"><div class="muted center"><span class="spin"></span> Camera khul raha hai…</div></div><div class="row mt"><button class="block" id="camCancel">Cancel</button></div>', function () { if (!done) { done = true; stopStream(stream); reject(new Error('Cancelled')); } });
    $('camCancel').onclick = function () { finish(null, new Error('Cancelled')); };
    function fallback(why) {
      if (window.WHM_ALLOW_CAPTURE_FALLBACK) { $('camBody').innerHTML = msg('info', why + ' Camera se photo lein.') + '<label class="btn primary block">📷 Photo lo<input type="file" accept="image/*" capture="user" class="hidden" id="camFile"></label>'; $('camFile').onchange = function (e) { var f = e.target.files[0]; if (!f) return; var fr = new FileReader(); fr.onload = function () { shrink(fr.result).then(function (d) { finish(d); }).catch(function (er) { finish(null, er); }); }; fr.readAsDataURL(f); }; }
      else { $('camBody').innerHTML = msg('err', why + ' Browser settings mein Camera ko Allow karein, phir dobara try karein.'); }
    }
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) return fallback('Is phone ka live camera nahi mil raha.');
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user', width: { ideal: 960 }, height: { ideal: 960 } }, audio: false }).then(function (st) {
      if (done) return stopStream(st); stream = st;
      $('camBody').innerHTML = '<video class="live" id="camVid" autoplay playsinline muted></video><button class="primary block big" id="camShot">📸 Photo lo</button>';
      var v = $('camVid'); v.srcObject = st; v.setAttribute('playsinline', ''); var p = v.play && v.play(); if (p && p.catch) p.catch(function () {});
      $('camShot').onclick = function () {
        if (!v.videoWidth) return toast('Camera abhi ready nahi hai. Ek second ruko.', 'err');
        var cv = document.createElement('canvas'), sc = Math.min(1, 640 / Math.max(v.videoWidth, v.videoHeight)); cv.width = Math.round(v.videoWidth * sc); cv.height = Math.round(v.videoHeight * sc);
        cv.getContext('2d').drawImage(v, 0, 0, cv.width, cv.height); var data = cv.toDataURL('image/jpeg', 0.6);
        stopStream(stream); stream = null;
        $('camBody').innerHTML = '<img src="' + data + '" style="width:100%;border-radius:12px;transform:scaleX(-1)"><div class="g2 mt"><button id="camRetake">Dobara lein</button><button class="primary" id="camUse">✓ Yeh theek hai</button></div>';
        $('camUse').onclick = function () { finish(data); };
        $('camRetake').onclick = function () { done = true; $('modal')._close = null; takeSelfie(title).then(resolve, reject); };
      };
    }).catch(function () { fallback('Camera ki permission nahi mili.'); });
  });
}
function shrink(dataUrl) { return new Promise(function (res, rej) { var im = new Image(); im.onload = function () { var cv = document.createElement('canvas'), sc = Math.min(1, 640 / Math.max(im.width, im.height)); cv.width = Math.round(im.width * sc); cv.height = Math.round(im.height * sc); cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height); res(cv.toDataURL('image/jpeg', 0.6)); }; im.onerror = function () { rej(new Error('Photo padh nahi paye')); }; im.src = dataUrl; }); }

// ---- router
var ROUTES = [];
function on(re, fn, role) { ROUTES.push({ re: re, fn: fn, role: role }); }
function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }
window.addEventListener('hashchange', function () { route(); });
function route() {
  closeModal(); var hash = location.hash || '#/home';
  if (!S.token) { if (hash !== '#/login') { location.hash = '#/login'; return; } }
  if (S.token && hash === '#/login') { location.hash = '#/home'; return; }
  for (var i = 0; i < ROUTES.length; i++) { var m = hash.match(ROUTES[i].re); if (m) { var R = ROUTES[i]; if (R.role && S.user && R.role.indexOf(S.user.role) < 0) { location.hash = '#/home'; return; } return R.fn(m); } }
  location.hash = '#/home';
}
function isAdmin() { return S.user && S.user.role === 'admin'; }
var ANAV = [['#/home', 'Dashboard'], ['#/day', 'Daily'], ['#/range', 'Staff / Unit'], ['#/requests', 'Requests'], ['#/mark', 'Mark / CO'], ['#/month', 'Payroll'], ['#/people', 'People'], ['#/audit', 'Audit'], ['#/settings', 'Settings'], ['#/info', 'Info']];
var SNAV = [['#/home', '🏠', 'Aaj'], ['#/cal', '📅', 'Calendar'], ['#/req', '📝', 'Requests'], ['#/more', '⚙️', 'More']];
function shell(body, active) {
  var admin = isAdmin(), hash = active || location.hash.split('?')[0], mgr = S.user.role === 'manager', tabs = SNAV.slice(); if (mgr) tabs.splice(1, 0, ['#/store', '🏬', 'Unit']);
  $('app').innerHTML = '<div class="' + (admin ? 'role-admin' : '') + '"><div class="top"><div class="logo">WM</div><div><b>Karwa Warehouse & MFG Attendance</b><small>' + h(S.user.store_name || S.user.role_label) + '</small></div>' +
    (admin ? '<div class="anav">' + ANAV.map(function (n) { return '<a href="' + n[0] + '" class="' + (hash === n[0] ? 'on' : '') + '">' + n[1] + '</a>'; }).join('') + '</div>' : '') +
    '<div class="who"><span class="nm">' + h(S.user.name) + '</span><button class="sm" data-act="logout">Logout</button></div></div>' +
    (admin ? '<div class="noprint" style="padding:6px 10px;background:#fff;border-bottom:1px solid var(--line)"><select id="amenu" data-change="amenu">' + ANAV.map(function (n) { return '<option value="' + n[0] + '"' + (hash === n[0] ? ' selected' : '') + '>' + n[1] + '</option>'; }).join('') + '</select></div>' : '') +
    '<div class="wrap">' + body + '</div>' +
    (admin ? '' : '<div class="tabs">' + tabs.map(function (t) { return '<a href="' + t[0] + '" class="' + (hash === t[0] ? 'on' : '') + '"><b>' + t[1] + '</b>' + t[2] + '</a>'; }).join('') + '</div>') + '</div>';
  var am = $('amenu'); if (am && window.matchMedia && window.matchMedia('(min-width:561px)').matches) am.parentNode.style.display = 'none';
}
function loading(t) { shell('<div class="card muted center"><span class="spin"></span> ' + h(t || 'Load ho raha hai…') + '</div>'); }
function ensureBoot() { if (S.boot) return Promise.resolve(S.boot); return call('boot').then(function (b) { S.boot = b; S.stores = b.stores || []; S.user = Object.assign(S.user || {}, b.user); return b; }); }
function storeOpts(sel, all) { return (all ? '<option value="">Sab stores</option>' : '') + S.stores.filter(function (s) { return s.active !== 0; }).map(function (s) { return '<option value="' + s.id + '"' + (String(sel) === String(s.id) ? ' selected' : '') + '>' + h(s.name) + '</option>'; }).join(''); }

// ---- login + password
on(/^#\/login$/, function () {
  $('app').innerHTML = '<div class="wrap" style="max-width:420px;padding-top:40px"><div class="center"><div class="logo" style="width:64px;height:64px;font-size:1.4rem;margin:0 auto 10px;background:var(--brand);color:#fff;border-radius:18px">WM</div><h2>Karwa Warehouse & MFG Attendance</h2><div class="muted small">Staff ID aur password se login karein</div></div>' +
    '<form class="card stack mt" data-form="login"><label>Staff ID<input name="login_id" autocomplete="username" autocapitalize="off" value="' + h(localStorage.getItem('whm_login') || '') + '" required></label><div class="pw"><label>Password<input name="password" type="password" autocomplete="current-password" required></label><button type="button" data-act="showpw">Show</button></div><div id="lerr"></div><button class="primary block big">Login</button></form><div class="muted small center">Password bhool gaye? Apne Admin se reset karwayein.</div></div>';
});
on(/^#\/pw$/, function () {
  var forced = S.user && S.user.must_change;
  (S.user ? shell : function (b) { $('app').innerHTML = '<div class="wrap">' + b + '</div>'; })('<div class="card narrow stack" style="max-width:460px"><h2>Naya password banayein</h2>' + (forced ? msg('info', 'Pehli baar login hai. Apna khud ka password banayein.') : '') +
    '<form class="stack" data-form="pw"><label>Purana / temporary password<input name="old" type="password" autocomplete="current-password" required></label><label>Naya password (kam se kam 6 akshar, letters + number)<input name="pw" type="password" autocomplete="new-password" required></label><label>Naya password dobara<input name="pw2" type="password" autocomplete="new-password" required></label><button class="primary block">Save</button></form></div>', '#/pw');
});

// ---- staff: Home (IN / OUT)
on(/^#\/home$/, function () {
  if (isAdmin()) return adminHome();
  loading(); ensureBoot().then(function () { return call('today'); }).then(function (t) {
    var st = t.state, b = '';
    b += '<div class="card center"><div class="muted small">' + h(dmy(t.date)) + ' · ' + h(t.store ? t.store.name : '') + '</div><h2>Namaste, ' + h(S.user.name) + '</h2>';
    b += '<div class="mt">Aaj ka status: ' + (t.day ? chip(t.day) : '<span class="muted">—</span>') + '</div>';
    if (t.day === 'pending') b += '<div class="muted small">Admin approve karega tab letter dikhega.</div>';
    b += '</div>';
    if (st === 'none') b += '<button class="primary big-btn" data-act="punch" data-kind="IN">🟢 IN (aa gaye)</button>';
    else if (st === 'in') b += '<div class="msg ok">IN recorded ✓</div><button class="accent big-btn" data-act="punch" data-kind="OUT">🔴 OUT (ja rahe hain)</button>';
    else b += '<div class="msg ok">IN aur OUT dono recorded ✓. Aaj ka kaam ho gaya.</div>';
    b += '<div class="card mt"><div class="muted small">Selfie sirf live camera se hi liya jata hai. Samay server khud lagata hai, aap badal nahi sakte. Aapko apna IN/OUT ka samay aur ghante nahi dikhte.</div></div>';
    b += '<div class="g2"><a class="btn" href="#/cal">📅 Mera calendar</a><a class="btn" href="#/req">📝 WO / Regularise</a></div>';
    shell(b);
  }).catch(function (e) { shell(msg('err', e.message) + '<button data-act="reload">Dobara try karein</button>'); });
});
function doPunch(kind, btn) {
  takeSelfie(kind === 'IN' ? 'IN ke liye selfie' : 'OUT ke liye selfie').then(function (photo) {

  var t = e.target.closest ? e.target.closest('[data-act]') : null; if (!t) return;
  var a = t.getAttribute('data-act'); if (a === 'mclose' && e.target.closest('[data-stop]')) return;
  if (ACT[a]) { if (t.tagName === 'A') e.preventDefault(); ACT[a](t, e); }
});
var CHG = {
  amenu: function (el) { location.hash = el.value; }, stdate: function (el) { STD = el.value; route(); },
  dday: function () { AD.date = $('dd').value; AD.store = $('ds').value; renderDay(); }, drange: function () { AR.from = $('rf').value; AR.to = $('rt').value; AR.store = $('rs').value; route(); },
  mkstore: function (el) { MK.store = el.value; loadMkUsers(); }, mkall: function (el) { document.querySelectorAll('.mku').forEach(function (c) { c.checked = el.checked; }); },
  dmonth: function () { AM.month = $('mm').value || AM.month; AM.store = $('ms').value; renderMonth(); }, pfilter: function () { PP.store = $('ps').value; PP.q = $('pq').value; renderPeople(); },
  daudit: function () { AU.from = $('af').value; AU.to = $('at').value; AU.action = $('aa').value.trim(); route(); },
  csvfile: function (el) { var f = el.files[0]; if (!f) return; var fr = new FileReader(); fr.onload = function () { $('csvtext').value = fr.result; }; fr.readAsText(f); }
};
document.addEventListener('change', function (e) { var t = e.target.closest ? e.target.closest('[data-change]') : null; if (t && CHG[t.getAttribute('data-change')]) CHG[t.getAttribute('data-change')](t); });
var FORMS = {
  login: function (f, d) { var btn = f.querySelector('button.primary'); btn.disabled = true; call('login', { login_id: d.login_id, password: d.password }).then(function (r) { localStorage.setItem('whm_login', d.login_id); saveSession(r.token, r.user); S.boot = null; location.hash = r.user.must_change ? '#/pw' : '#/home'; }).catch(function (e) { btn.disabled = false; $('lerr').innerHTML = msg('err', e.message); }); },
  pw: function (f, d) { if (d.pw !== d.pw2) return toast('Dono naye password same nahi hain', 'err'); call('changePassword', { old: d.old, pw: d.pw }).then(function (r) { saveSession(r.token, Object.assign({}, S.user, { must_change: 0 })); S.boot = null; toast('Password badal gaya ✓'); location.hash = '#/home'; }).catch(fail); },
  wo: function (f, d) { call('requestWO', { date: d.date, note: d.note }).then(function (r) { done(r.message); }).catch(fail); },
  reg: function (f, d) { call('requestReg', { date: d.date, which: d.which, reason: d.reason }).then(function (r) { done(r.message); }).catch(fail); },
  rej: function (f, d) { call('reject', { ids: [f.getAttribute('data-id')], reason: d.reason }).then(function () { done('Rejected'); }).catch(fail); },
  mark: function (f, d) { call('mark', { user_id: f.getAttribute('data-uid'), date: d.date, status: d.status, reason: d.reason }).then(function () { AD.date = d.date; done('Mark ho gaya ✓'); }).catch(fail); },
  edit: function (f, d) { call('modify', { user_id: f.getAttribute('data-uid'), date: d.date, status: d.status, in_hm: d.in_hm, out_hm: d.out_hm, reason: d.reason }).then(function () { AD.date = d.date; done('Badlav save ho gaya (audit log mein) ✓'); }).catch(fail); },
  wor: function (f, d) { call('decideWO', { id: f.getAttribute('data-id'), ok: false, remark: d.remark }).then(function () { done('Rejected'); }).catch(fail); },
  regd: function (f, d) { call('decideReg', { id: f.getAttribute('data-id'), ok: f.getAttribute('data-ok') === '1', status: d.status, in_hm: d.in_hm, out_hm: d.out_hm, remark: d.remark }).then(function (r) { done(r.status === 'approved' ? 'Approved ✓' : 'Rejected'); }).catch(fail); },
  absent: function (f, d) { call('markUnmarkedAbsent', { from: f.getAttribute('data-from'), to: f.getAttribute('data-to'), store_id: AM.store, confirm_count: Number(f.getAttribute('data-n')), reason: d.reason }).then(function (r) { done(r.marked + ' din Absent mark ho gaye'); }).catch(fail); },
  lock: function (f, d) { call('lockMonth', { month: AM.month, force: d.force ? 1 : 0, mark_absent: d.mark_absent ? 1 : 0, expect_unmarked: Number(f.getAttribute('data-n')) }).then(function () { done('Mahina lock ho gaya 🔒'); }).catch(fail); },
  unlock: function (f, d) { call('unlockMonth', { month: AM.month, reason: d.reason }).then(function () { done('Unlock ho gaya'); }).catch(fail); },
  bulkmark: function (f, d) {
    var ids = Array.prototype.map.call(document.querySelectorAll('.mku:checked'), function (c) { return c.value; }); if (!ids.length) return toast('Kam se kam ek staff chuniye', 'err'); if (d.to < d.from) return toast('To date From se pehle hai', 'err');
    if (!confirm(ids.length + ' staff ko ' + d.status + ' lagana hai (' + dmy(d.from) + ' se ' + dmy(d.to) + ')?')) return;
    call('mark', { user_ids: ids, from: d.from, to: d.to, status: d.status, reason: d.reason }).then(function (r) { toast(r.changed + ' entries ho gayi ✓'); }).catch(fail);
  },
  store: function (f, d) { call('saveStore', { id: d.id, code: d.code, name: d.name, address: d.address, active: f.querySelector('[name=active]') ? (d.active ? 1 : 0) : undefined }).then(function () { S.boot = null; return ensureBoot(); }).then(function () { done('Store save ✓'); }).catch(fail); },
  user: function (f, d) { var payload = { id: d.id, login_id: d.login_id, name: d.name, store_id: d.store_id, role: d.role, phone: d.phone, joined_on: d.joined_on, temp_password: d.temp_password }; if (d.id) payload.active = d.active ? 1 : 0; call('saveUser', payload).then(function (r) { if (r.temp_password) { closeModal(); showPasswords('Staff add ho gaya', [{ login_id: r.login_id, name: d.name, temp_password: r.temp_password }]); renderPeople(); } else done('Save ✓'); }).catch(fail); },
  csv: function (f, d) { call('importStaffCsv', { csv: d.csv }).then(function (r) { var sk = r.skipped.length ? '<div class="msg err">Skip hue (' + r.skipped.length + '): ' + r.skipped.map(function (x) { return 'row ' + x.row + ' ' + h(x.login_id) + ': ' + h(x.reason); }).join(' · ') + '</div>' : ''; showPasswords(r.created + ' staff add hue', r.passwords); if (sk) $('modal').querySelector('.box').insertAdjacentHTML('beforeend', sk); }).catch(fail); },
  settings: function (f, d) { call('saveSettings', { values: d }).then(function (r) { toast(r.changed.length ? 'Save ✓ (' + r.changed.join(', ') + ')' : 'Koi badlav nahi'); }).catch(fail); }
};
document.addEventListener('submit', function (e) { var f = e.target; var k = f.getAttribute && f.getAttribute('data-form'); if (!k || !FORMS[k]) return; e.preventDefault(); FORMS[k](f, formData(f)); });

// ---- start
if ('serviceWorker' in navigator && location.protocol.indexOf('http') === 0) navigator.serviceWorker.register('sw.js').catch(function () {});
if (S.token && S.user && S.user.must_change) { location.hash = '#/pw'; }
route();
</script>
